name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Smoke test on fixtures
        shell: bash
        run: |
          go run ./cmd/cloudweave analyze \
            -s azure=testdata/multicloud/azure.tfstate -s gcp=testdata/multicloud/gcp.tfstate \
            -p testdata/multicloud/azure-plan.json -o report.html --json report.json
          test -s report.html && test -s report.json
