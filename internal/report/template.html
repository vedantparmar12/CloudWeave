<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>CloudWeave preflight report</title>
<style>
:root{--bg:#0f1419;--panel:#161d26;--panel2:#1d2631;--line:#2a3542;--text:#d8dee6;--muted:#8a96a6;
--crit:#ff4d6d;--high:#ff8c42;--med:#f6c344;--low:#5fb3f9;--info:#8a96a6;
--azure:#3b8eea;--gcp:#34a853;--aws:#ff9900;--k8s:#8c6cf0;--other:#7d8794;
--create:#3fb950;--update:#d29922;--delete:#f85149;--replace:#db61a2;--drift:#ff8c42}
*{box-sizing:border-box}
body{margin:0;font:13px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:17px;margin:0;font-weight:600}
.badge{padding:3px 10px;border-radius:12px;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.v-block{background:var(--crit);color:#fff}.v-review{background:var(--high);color:#111}
.v-caution{background:var(--med);color:#111}.v-clear{background:var(--create);color:#111}
.muted{color:var(--muted)}.small{font-size:12px}
.ro{margin-left:auto;font-size:12px;color:var(--muted)}
nav{display:flex;gap:2px;padding:0 20px;background:var(--panel);border-bottom:1px solid var(--line)}
nav button{background:none;border:0;color:var(--muted);padding:10px 14px;cursor:pointer;font:inherit;border-bottom:2px solid transparent}
nav button.active{color:var(--text);border-bottom-color:var(--low)}
.layout{display:flex;height:calc(100vh - 92px)}
main{flex:1;overflow:auto;padding:16px 20px}
aside{width:340px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px}
.tab{display:none}.tab.active{display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.card .n{font-size:22px;font-weight:600}.card .l{color:var(--muted);font-size:12px}
h2{font-size:14px;margin:18px 0 8px;font-weight:600}
.sev{display:inline-block;min-width:62px;text-align:center;padding:1px 6px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase}
.sev-critical{background:var(--crit);color:#fff}.sev-high{background:var(--high);color:#111}
.sev-medium{background:var(--med);color:#111}.sev-low{background:var(--low);color:#111}.sev-info{background:var(--line);color:var(--text)}
.finding{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.finding .t{font-weight:600;margin-left:6px}.finding .rule{color:var(--muted);font-size:11px;margin-left:6px}
.finding p{margin:6px 0 0}.finding .fix{color:#9fd3a8}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:1px 8px;font-size:11px;cursor:pointer;color:var(--text);font-family:ui-monospace,Consolas,monospace}
.chip:hover{border-color:var(--low)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.toolbar label{display:flex;gap:4px;align-items:center;color:var(--muted)}
input[type=search],select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
input[type=search]{width:340px}
button.b{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
.graph{border:1px solid var(--line);border-radius:8px;background:#0b1015;overflow:hidden;height:calc(100vh - 230px);position:relative;cursor:grab;touch-action:none}
.graph.panning{cursor:grabbing}
.graph svg{display:block;width:100%;height:100%}
.hint{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted);pointer-events:none}
.node rect{rx:6;ry:6}
.node{cursor:pointer;transition:opacity .12s}
.node text{fill:var(--text);font-size:11px;font-family:ui-monospace,Consolas,monospace;pointer-events:none}
.node text.sub{fill:var(--muted);font-family:inherit;font-size:10px}
.node.sel rect.box{stroke:#fff;stroke-width:2.5}
.e{transition:opacity .12s}
svg.dim .node{opacity:.25}svg.dim .node.hl{opacity:1}
svg.dim .e{opacity:.05}svg.dim .e.hl{opacity:1;stroke-width:2.6}
svg.dim .e.down{stroke-dasharray:6 3}
.abar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--panel2);margin:6px 0 4px;max-width:720px}
.abar div{height:100%}
.alegend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted)}
.alegend b{color:var(--text)}
.order{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:6px 0}
.order .st{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-weight:600}
.order .st i{font-style:normal;color:var(--muted);font-weight:400;margin-right:6px}
.pill{display:inline-block;min-width:58px;text-align:center;border-radius:4px;padding:0 6px;font-size:11px;font-weight:600;color:#111;margin-right:6px}
.a-create{background:#3fb950}.a-update{background:#d29922}.a-replace{background:#db61a2}.a-delete,.a-forget{background:#f85149}.a-drift{background:#ff8c42}
.toggle{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:2px 10px 2px 4px;cursor:pointer;color:var(--text);background:var(--panel2);user-select:none}
.toggle.off{opacity:.4}
.toggle .pill{margin:0}
.tree details{margin:0}
.tree summary{padding:4px 6px;border-radius:4px}
.tree summary:hover{background:var(--panel2)}
.tree .lvl{margin-left:18px;border-left:1px solid var(--line);padding-left:8px}
.tree .cnt{margin-left:8px}
.tree .cnt span{display:inline-block;font-size:11px;padding:0 5px;border-radius:3px;margin-left:3px;color:#111;font-weight:600}
.crow{padding:5px 6px;border-bottom:1px solid #1f2833}
.crow .chip{font-size:12px}
.why{color:var(--muted);font-size:12px;margin:3px 0 0 64px}
.why b{color:#c9d1d9;font-weight:500}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:0 6px;margin:2px 3px 2px 0;font-family:ui-monospace,Consolas,monospace;font-size:11px}
.tag.rep{border-color:#db61a2;color:#f0a6d0}.tag.unk{border-style:dashed}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);margin-bottom:8px}
.legend span i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:500}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
details{margin:2px 0}summary{cursor:pointer;padding:2px 0}
.inv{margin-left:16px}
.results{max-height:180px;overflow:auto;margin-bottom:10px}
.results div{padding:3px 6px;cursor:pointer;border-radius:4px}
.results div:hover{background:var(--panel2)}
.kv{display:grid;grid-template-columns:90px 1fr;gap:3px 8px;margin:8px 0}
.kv div:nth-child(odd){color:var(--muted)}
.empty{color:var(--muted);padding:30px;text-align:center}
.disclaimer{font-size:12px;color:var(--muted);border-left:3px solid var(--med);padding:6px 10px;background:var(--panel);margin:10px 0}
</style>
</head>
<body>
<header>
  <h1>CloudWeave</h1>
  <span id="verdict" class="badge"></span>
  <span id="gen" class="muted small"></span>
  <span class="ro">Read-only preflight · no state writes · no cloud calls</span>
</header>
<nav id="tabs">
  <button data-tab="overview" class="active">Overview</button>
  <button data-tab="plan">Plan changes</button>
  <button data-tab="findings">Findings</button>
  <button data-tab="cone">Change cone</button>
  <button data-tab="explore">Explore</button>
  <button data-tab="inventory">Inventory</button>
</nav>
<div class="layout">
<main>
  <section id="tab-overview" class="tab active">
    <div id="cards" class="cards"></div>
    <div id="disclaimer" class="disclaimer"></div>
    <div id="plan-bar"></div>
    <div id="apply-order"></div>
    <h2>Top findings</h2>
    <div id="top-findings"></div>
    <h2>State map</h2>
    <div class="muted small">Each box is a state. Lines are dependencies discovered across states (remote state outputs, shared IDs, identity federation).</div>
    <div id="state-map"></div>
    <div id="cross-table"></div>
  </section>
  <section id="tab-findings" class="tab">
    <div class="toolbar">
      <label>Min severity <select id="f-sev"></select></label>
      <label>Category <select id="f-cat"></select></label>
      <span id="f-count" class="muted"></span>
    </div>
    <div id="findings"></div>
  </section>
  <section id="tab-plan" class="tab">
    <div class="toolbar">
      <span id="p-toggles" style="display:flex;flex-wrap:wrap;gap:6px"></span>
      <input type="search" id="p-q" placeholder="Filter by address, type or attribute">
      <button class="b" id="p-expand">Expand all</button><button class="b" id="p-collapse">Collapse all</button>
      <span id="p-info" class="muted"></span>
    </div>
    <div id="plan-tree" class="tree"></div>
  </section>
  <section id="tab-cone" class="tab">
    <div class="toolbar">
      <label>State <select id="c-state"></select></label>
      <label><input type="checkbox" id="c-up" checked> show direct dependencies</label>
      <label>Max depth <select id="c-depth"><option>1</option><option>2</option><option selected>3</option><option>5</option><option value="99">all</option></select></label>
      <button class="b" data-zoom="cone" data-z="1.25" title="Zoom in">+</button><button class="b" data-zoom="cone" data-z="0.8" title="Zoom out">−</button><button class="b" data-fit="cone">Fit</button><button class="b" data-export="cone">Export SVG</button>
      <span id="c-info" class="muted"></span>
    </div>
    <div id="legend-cone" class="legend"></div>
    <div id="g-cone" class="graph"></div>
  </section>
  <section id="tab-explore" class="tab">
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search address, type or module (press / to focus)">
      <label>Radius <select id="e-depth"><option>1</option><option selected>2</option><option>3</option></select></label>
      <button class="b" data-zoom="explore" data-z="1.25" title="Zoom in">+</button><button class="b" data-zoom="explore" data-z="0.8" title="Zoom out">−</button><button class="b" data-fit="explore">Fit</button><button class="b" data-export="explore">Export SVG</button>
      <span id="e-info" class="muted"></span>
    </div>
    <div id="results" class="results"></div>
    <div id="legend-explore" class="legend"></div>
    <div id="g-explore" class="graph"></div>
  </section>
  <section id="tab-inventory" class="tab"><div id="inventory"></div></section>
</main>
<aside id="detail"><div class="empty">Select a resource to see its details, dependencies and dependents.</div></aside>
</div>
<script id="cw-data" type="application/json">/*CLOUDWEAVE_DATA*/</script>
<script>
(function(){
"use strict";
var R = JSON.parse(document.getElementById("cw-data").textContent);
var SEV = ["info","low","medium","high","critical"];
var NODES = {}, OUT = {}, IN = {};
R.nodes.forEach(function(n){ NODES[n.id]=n; OUT[n.id]=[]; IN[n.id]=[]; });
R.edges.forEach(function(e){ if(NODES[e.from]&&NODES[e.to]){ OUT[e.from].push(e); IN[e.to].push(e);} });
var selected = null, focus = null;

function h(tag, attrs){
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs) { if (k==="text") el.textContent = attrs[k]; else if (k==="onclick") el.addEventListener("click", attrs[k]); else el.setAttribute(k, attrs[k]); }
  for (var i=2;i<arguments.length;i++){ var c=arguments[i]; if(c==null) continue; el.appendChild(typeof c==="string"?document.createTextNode(c):c); }
  return el;
}
function s(tag, attrs){
  var el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  if (attrs) for (var k in attrs) { if (k==="text") el.textContent = attrs[k]; else el.setAttribute(k, attrs[k]); }
  return el;
}
function clear(el){ while(el.firstChild) el.removeChild(el.firstChild); return el; }
function $(id){ return document.getElementById(id); }
function short(str, n){ return str.length>n ? "…"+str.slice(str.length-n+1) : str; }
var CLOUD = {azure:"#3b8eea", gcp:"#34a853", aws:"#ff9900", kubernetes:"#8c6cf0", other:"#7d8794"};
var ACT = {create:"#3fb950", update:"#d29922", "delete":"#f85149", replace:"#db61a2", forget:"#f85149"};
var DRIFT = "#ff8c42";
var EDGE = {dependency:["#56626f",""], "remote-state":["#3b8eea","6 4"], "id-match":["#a371f7","3 3"], federation:["#ff8c42","8 3"]};
var ACTIONS = ["replace","delete","create","update","forget"];
function changeKind(n){ return ACT[n.action] ? n.action : (n.drift && n.drift!=="no-op" ? "drift" : ""); }

// header
var vb = $("verdict"); vb.textContent = {block:"Block apply", review:"Review required", caution:"Caution", clear:"No blocking issues"}[R.verdict]||R.verdict;
vb.className = "badge v-"+R.verdict;
$("gen").textContent = "generated "+R.generated_at+" · "+R.tool_version;
$("disclaimer").textContent = R.disclaimer;

// tabs
var tabs = document.querySelectorAll("#tabs button");
function showTab(name){
  tabs.forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-tab")===name); });
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("active", t.id==="tab-"+name); });
  if (name==="cone") renderCone();
  if (name==="explore") renderExplore();
}
tabs.forEach(function(b){ b.addEventListener("click", function(){ showTab(b.getAttribute("data-tab")); }); });
document.addEventListener("keydown", function(e){
  if (e.key==="/" && document.activeElement.tagName!=="INPUT"){ e.preventDefault(); showTab("explore"); $("q").focus(); }
});

// pan and zoom: one controller per graph container, reused across renders
var PZ = {};
function panZoom(key){
  if (PZ[key]) return PZ[key];
  var box = $("g-"+key), st = {k:1, x:0, y:0, w:1, h:1, root:null, drag:null, moved:false};
  function apply(){ if (st.root) st.root.setAttribute("transform","translate("+st.x+","+st.y+") scale("+st.k+")"); }
  st.zoomAt = function(f, mx, my){
    var nk = Math.max(0.08, Math.min(4, st.k*f));
    st.x = mx-(mx-st.x)*nk/st.k; st.y = my-(my-st.y)*nk/st.k; st.k = nk; apply();
  };
  st.zoomCenter = function(f){ st.zoomAt(f, box.clientWidth/2, box.clientHeight/2); };
  st.fit = function(){
    var cw = box.clientWidth||900, ch = box.clientHeight||500;
    st.k = Math.max(0.08, Math.min(1, (cw-20)/st.w, (ch-20)/st.h));
    st.x = Math.max(10, (cw-st.w*st.k)/2); st.y = Math.max(10, (ch-st.h*st.k)/2); apply();
  };
  st.attach = function(root, w, h){ st.root = root; st.w = w; st.h = h; st.fit(); };
  box.addEventListener("wheel", function(e){
    if (!st.root) return;
    e.preventDefault();
    var r = box.getBoundingClientRect(), dy = e.deltaY*(e.deltaMode===1?16:1);
    st.zoomAt(Math.exp(-dy*0.0015), e.clientX-r.left, e.clientY-r.top);
  }, {passive:false});
  box.addEventListener("pointerdown", function(e){ if (st.root && e.button===0){ st.drag=[e.clientX,e.clientY,st.x,st.y]; st.moved=false; } });
  window.addEventListener("pointermove", function(e){
    if (!st.drag) return;
    var dx = e.clientX-st.drag[0], dy = e.clientY-st.drag[1];
    if (!st.moved && Math.abs(dx)+Math.abs(dy) > 4){ st.moved = true; box.classList.add("panning"); }
    if (st.moved){ st.x = st.drag[2]+dx; st.y = st.drag[3]+dy; apply(); }
  });
  window.addEventListener("pointerup", function(){ st.drag = null; box.classList.remove("panning"); });
  box.addEventListener("click", function(e){ if (st.moved){ e.stopPropagation(); st.moved = false; } }, true);
  PZ[key] = st; return st;
}
document.querySelectorAll("[data-zoom]").forEach(function(b){ b.addEventListener("click", function(){
  panZoom(b.getAttribute("data-zoom")).zoomCenter(parseFloat(b.getAttribute("data-z"))); }); });
document.querySelectorAll("[data-fit]").forEach(function(b){ b.addEventListener("click", function(){ panZoom(b.getAttribute("data-fit")).fit(); }); });
document.querySelectorAll("[data-export]").forEach(function(b){ b.addEventListener("click", function(){ exportSVG(b.getAttribute("data-export")); }); });

// The exported file is standalone: page CSS and transforms do not apply there.
function exportSVG(key){
  var st = PZ[key]; if (!st || !st.root) return;
  var svg = st.root.ownerSVGElement.cloneNode(true);
  svg.setAttribute("xmlns","http://www.w3.org/2000/svg");
  svg.setAttribute("width", st.w); svg.setAttribute("height", st.h); svg.setAttribute("viewBox","0 0 "+st.w+" "+st.h);
  svg.removeAttribute("class");
  svg.querySelector("g.root").removeAttribute("transform");
  svg.querySelectorAll(".hl,.down").forEach(function(el){ el.classList.remove("hl"); el.classList.remove("down"); });
  var style = s("style",{text:"text{font:11px ui-monospace,Consolas,monospace;fill:#d8dee6}text.sub{font:10px Segoe UI,Arial,sans-serif;fill:#8a96a6}.node.sel rect.box{stroke:#fff;stroke-width:2.5}"});
  svg.insertBefore(style, svg.firstChild);
  svg.insertBefore(s("rect",{width:st.w,height:st.h,fill:"#0b1015"}), style.nextSibling);
  var blob = new Blob([new XMLSerializer().serializeToString(svg)], {type:"image/svg+xml"});
  var a = h("a",{href:URL.createObjectURL(blob), download:"cloudweave-"+key+".svg"});
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

// overview cards
(function(){
  var c = $("cards");
  function card(n,l){ c.appendChild(h("div",{"class":"card"},h("div",{"class":"n",text:String(n)}),h("div",{"class":"l",text:l}))); }
  var res=0, inst=0; R.states.forEach(function(s){ res+=s.resources; inst+=s.instances; });
  card(R.states.length, "states");
  card(res, "managed resources");
  card(inst, "instances");
  if (R.plan){
    var a=R.plan.actions||{};
    card((a.create||0)+" / "+(a.update||0)+" / "+((a["delete"]||0)+(a.replace||0)), "create / update / delete+replace");
    card(R.plan.drift, "drifted (refresh)");
    if (R.plan.age_minutes!=null){
      var m=R.plan.age_minutes;
      card(m<120 ? m+" min" : m<2880 ? Math.round(m/60)+" h" : Math.round(m/1440)+" d", "plan age");
    }
  }
  var cross=R.edges.filter(function(e){ return NODES[e.from]&&NODES[e.to]&&NODES[e.from].state!==NODES[e.to].state; }).length;
  card(cross, "cross-state links");
  card((R.finding_counts.critical||0)+" / "+(R.finding_counts.high||0)+" / "+(R.finding_counts.medium||0), "critical / high / medium");
  var top = $("top-findings");
  var tf = R.findings.filter(function(f){ return SEV.indexOf(f.severity)>=3; }).slice(0,5);
  if (!tf.length) top.appendChild(h("div",{"class":"muted",text:"No critical or high findings."}));
  tf.forEach(function(f){ top.appendChild(findingEl(f)); });

  if (R.plan){
    var acts=R.plan.actions||{}, total=0, bar=h("div",{"class":"abar"}), leg=h("div",{"class":"alegend"});
    ACTIONS.forEach(function(k){ total+=acts[k]||0; });
    ACTIONS.concat(["drift"]).forEach(function(k){
      var n = k==="drift" ? R.plan.drift : acts[k]||0;
      if (!n) return;
      if (k!=="drift") bar.appendChild(h("div",{style:"width:"+(100*n/total)+"%;background:"+ACT[k],title:n+" "+k}));
      leg.appendChild(h("span",null,h("span",{"class":"pill a-"+k,text:k}),h("b",{text:String(n)})));
    });
    var pb=$("plan-bar");
    pb.appendChild(h("h2",{text:"Plan"}));
    if (total){ pb.appendChild(bar); }
    else pb.appendChild(h("div",{"class":"muted",text:"The plan changes no resources."}));
    pb.appendChild(leg);
    if (total) pb.appendChild(h("div",{"class":"small",style:"margin-top:6px"},h("a",{href:"#",style:"color:var(--low)",text:"Review every change and why it happens →",onclick:function(e){ e.preventDefault(); showTab("plan"); }})));
  }
  var order=R.apply_order||[];
  if (order.length>1){
    var ob=$("apply-order"), row=h("div",{"class":"order"});
    order.forEach(function(name,i){
      if (i) row.appendChild(h("span",{"class":"muted",text:"→"}));
      row.appendChild(h("span",{"class":"st"},h("i",{text:String(i+1)}),name));
    });
    ob.appendChild(h("h2",{text:"Apply order across states"}));
    ob.appendChild(row);
    ob.appendChild(h("div",{"class":"muted small",text:"States that provide outputs or IDs to other states come first. Identity-federation links are ignored here because trust can be configured in either order."}));
  }
})();

function findingEl(f){
  var chips = h("div",{"class":"chips"});
  (f.nodes||[]).slice(0,30).forEach(function(id){ chips.appendChild(h("span",{"class":"chip",title:id,text:short(id,60),onclick:function(){ openNode(id); }})); });
  if ((f.nodes||[]).length>30) chips.appendChild(h("span",{"class":"muted small",text:"+"+(f.nodes.length-30)+" more"}));
  return h("div",{"class":"finding"},

    });
    if (n.sensitive_attrs) box.appendChild(h("div",{"class":"small",text:n.sensitive_attrs+" sensitive attribute"+(n.sensitive_attrs>1?"s":"")+" also change; names hidden because Terraform marks them sensitive"}));
    (n.reasons||[]).forEach(function(r){ box.appendChild(h("div",{"class":"small",text:"Terraform: "+humanReason(r)})); });
    if (n.importing) box.appendChild(h("div",{"class":"small",text:"Imported by this plan"}));
    box.appendChild(h("div",{"class":"muted small",style:"margin-top:4px",text:"Attribute names only; values are never included in this report."}));
  }
  box.appendChild(h("button",{"class":"b",text:"Explore neighborhood",onclick:function(){ focus=id; showTab("explore"); }}));
  function edges(title,list,key){
    box.appendChild(h("h2",{text:title+" ("+list.length+")"}));
    list.slice(0,100).forEach(function(e){
      var other=e[key];
      box.appendChild(h("div",{style:"margin:3px 0"},h("span",{"class":"chip",text:short(other,48),title:other,onclick:function(){ openNode(other); }}),
        h("span",{"class":"muted small",text:" "+e.kind+(e.evidence?" · "+e.evidence:"")})));
    });
    if(list.length>100) box.appendChild(h("div",{"class":"muted small",text:"+"+(list.length-100)+" more"}));
  }
  edges("Depends on", OUT[id]||[], "to");
  edges("Used by", IN[id]||[], "from");
  var related=R.findings.filter(function(f){ return (f.nodes||[]).indexOf(id)>=0; });
  if(related.length){ box.appendChild(h("h2",{text:"Findings"})); related.forEach(function(f){ box.appendChild(findingEl(f)); }); }
  document.querySelectorAll(".node").forEach(function(g){ g.classList.toggle("sel", g.getAttribute("data-id")===id); });
}
function openNode(id){ if(!NODES[id]) return; focus=id; select(id); showTab("explore"); }

// inventory: state -> module -> type, lazily expanded
(function(){
  var box=$("inventory");
  R.states.forEach(function(st){
    var nodes=R.nodes.filter(function(n){ return n.state===st.name; });
    var d=h("details",null,h("summary",null,h("b",{text:st.name}),h("span",{"class":"muted",text:"  "+st.format+" · TF "+(st.terraform_version||"?")+(st.serial!=null?" · serial "+st.serial:"")+" · "+st.resources+" resources, "+st.data_sources+" data sources"+(st.primary?" · plan target":"")})));
    var filled=false;
    d.addEventListener("toggle",function(){
      if(!d.open||filled) return; filled=true;
      var mods={};
      nodes.forEach(function(n){ var m=n.module||"(root)"; (mods[m]=mods[m]||{})[n.type]=((mods[m]||{})[n.type]||[]).concat([n]); });
      Object.keys(mods).sort().forEach(function(m){
        var types=mods[m], cnt=0; Object.keys(types).forEach(function(t){ cnt+=types[t].length; });
        var md=h("details",{"class":"inv"},h("summary",null,h("span",{"class":"mono",text:m}),h("span",{"class":"muted",text:"  "+cnt})));
        Object.keys(types).sort().forEach(function(t){
          var td=h("details",{"class":"inv"},h("summary",null,h("span",{"class":"mono",text:t}),h("span",{"class":"muted",text:"  "+types[t].length})));
          var tfilled=false;
          td.addEventListener("toggle",function(){ if(!td.open||tfilled) return; tfilled=true;
            types[t].forEach(function(n){ td.appendChild(h("div",{"class":"inv"},h("span",{"class":"chip",text:n.address+(n.action&&n.action!=="no-op"?"  ["+n.action+"]":""),onclick:function(){ openNode(n.id); }}))); }); });
          md.appendChild(td);
        });
        d.appendChild(md);
      });
    });
    box.appendChild(d);
  });
})();
})();
</script>
</body>
