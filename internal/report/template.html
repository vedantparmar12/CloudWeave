<body>
<header>
  <div class="brand"><span class="brand-mark" aria-hidden="true">C</span><div><div class="eyebrow">Preflight workspace</div><h1>CloudWeave</h1></div></div>
  <span id="verdict" class="badge"></span><span id="source-summary" class="small"></span>
  <div class="header-end"><span id="gen" class="small">Read-only · local report</span><label class="theme-picker">Theme <select id="theme" aria-label="Color theme"><option value="system">System</option><option value="dark">Dark</option><option value="light">Light</option></select></label></div>
</header>
<div class="toolbar" aria-label="Graph controls">
  <div class="search"><input id="q" type="search" aria-label="Search all resources" aria-controls="results" placeholder="Find a resource, module or state…  /"><div id="results" class="results" hidden></div></div>
  <label>State <select id="state" aria-label="Filter graph by state"><option value="">All states</option></select></label>
  <label>View <select id="view" aria-label="Graph view"><option value="impact">Change impact</option><option value="all">All resources</option><option value="order">Dependency order</option></select></label>
  <button id="sources">Inputs &amp; help</button><button id="simulate">Pseudo apply</button>
</div>
<div class="layout">
  <main>
    <div class="canvas-heading"><div><h2 id="graph-title">Resource graph</h2><p id="graph-context" class="small"></p></div><button id="toggle-detail" aria-controls="detail" aria-expanded="true">Hide inspector</button></div>

    <div class="canvas-footer">
      <div class="canvas-tools"><button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-level" class="small zoom-level">100%</span><button id="zoom-in" aria-label="Zoom in">+</button><button id="fit" title="Fit all visible nodes (0)">Fit</button><button id="reset" title="Restore the default graph and all findings">Reset</button><button id="export">Export SVG</button></div>
      <div class="legend small" aria-label="Connection legend"><span><i></i>Dependency</span><span><i class="remote"></i>Remote state</span><span><i class="federation"></i>Federation</span></div>
      <div class="canvas-help">Scroll to zoom · drag to pan · select a resource to explore its connections · arrows point toward dependents</div>
    </div>
  </main>
  <aside id="detail" aria-label="Findings and resource details"></aside>

<script id="cw-data" type="application/json">/*CLOUDWEAVE_DATA*/</script>
<script>
(function(){

var sourceNames=new Map([["file","JSON file"],["postgresql","PostgreSQL"],["plan","Plan prior state"]]),stateDetails=new Map();
(R.states||[]).forEach(function(st){stateDetails.set(st.name,st);});

$("source-summary").textContent=Array.from(sourceCounts,function(pair){return pair[1]+" "+pair[0]+(pair[0]==="JSON file"&&pair[1]!==1?"s":"");}).join(" · ");

// One pan/zoom controller survives every graph redraw.
var box=$("g-graph"), pz={k:1,x:0,y:0,w:1,h:1,root:null,drag:null,moved:false};

// Apply the global budget before layout; focus is inserted before all other nodes.
function candidates(){
